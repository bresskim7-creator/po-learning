<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>TTS 실청취 검증 — PO 말하기 신규 낱말</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    background: #f3f4f6; color: #1f2937; padding-bottom: 88px;
  }
  header {
    position: sticky; top: 0; z-index: 10; background: #4A3A75; color: #fff;
    padding: 14px 16px; box-shadow: 0 2px 6px rgba(0,0,0,0.15);
  }
  header h1 { margin: 0 0 4px; font-size: 17px; }
  header .sub { font-size: 12px; opacity: 0.85; }
  .controls { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; align-items: center; }
  .btn {
    border: 0; border-radius: 8px; padding: 9px 14px; font-size: 14px; font-weight: 600;
    cursor: pointer; background: #fff; color: #4A3A75;
  }
  .btn.ghost { background: rgba(255,255,255,0.18); color: #fff; }
  .btn.on { background: #fbbf24; color: #1f2937; }
  .status {
    margin-top: 8px; font-size: 13px; min-height: 18px; opacity: 0.95;
  }
  .notice {
    margin: 40px 16px; padding: 20px; background: #fff; border-radius: 12px;
    font-size: 15px; line-height: 1.6; text-align: center; color: #374151;
  }
  .group { margin: 16px 12px; }
  .group h2 { font-size: 15px; color: #4A3A75; margin: 18px 4px 8px; }
  .row {
    display: flex; align-items: center; gap: 10px; background: #fff;
    border-radius: 10px; padding: 12px 14px; margin-bottom: 8px;
    border: 2px solid transparent;
  }
  .row.playing { border-color: #4A3A75; background: #f5f3ff; }
  .row .ortho { font-size: 26px; font-weight: 700; letter-spacing: 0.03em; }
  .row .pron { font-size: 15px; color: #9ca3af; margin-left: 2px; }
  .row .grow { flex: 1; }
  .row .play { border: 0; background: #ede9fe; color: #4A3A75; border-radius: 8px; padding: 8px 12px; font-size: 18px; cursor: pointer; }
  .row .play:active { background: #ddd6fe; }
  .row label.flag { display: flex; align-items: center; gap: 5px; font-size: 12px; color: #b45309; cursor: pointer; user-select: none; }
  .row label.flag input { width: 18px; height: 18px; }
  .bottombar {
    position: fixed; bottom: 0; left: 0; right: 0; background: #fff;
    border-top: 1px solid #e5e7eb; padding: 12px 16px; display: flex;
    gap: 12px; align-items: center; box-shadow: 0 -2px 8px rgba(0,0,0,0.06);
  }
  .bottombar .count { flex: 1; font-size: 14px; color: #374151; }
  .bottombar .count b { color: #b45309; }
  .bottombar .copy { background: #4A3A75; color: #fff; }
  .toast {
    position: fixed; bottom: 96px; left: 50%; transform: translateX(-50%);
    background: rgba(31,41,55,0.92); color: #fff; padding: 10px 18px; border-radius: 20px;
    font-size: 13px; opacity: 0; transition: opacity 0.2s; pointer-events: none; z-index: 20;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<header>
  <h1>🔊 발음 실청취 검증</h1>
  <div class="sub">v5.82.0 신규 낱말 67개 · 앱과 동일한 엔진(Chirp3 HD)으로 듣기</div>
  <div class="controls">
    <button class="btn" id="btn-play-all">▶ 전체 차례로 듣기</button>
    <button class="btn ghost" id="btn-stop">⏹ 중지</button>
    <button class="btn ghost" id="btn-rate">🐢 천천히 0.7</button>
  </div>
  <div class="status" id="status"></div>
</header>

<div id="main"></div>

<div class="bottombar" id="bottombar" style="display:none;">
  <div class="count" id="count">이상해요 체크: <b>0</b>개</div>
  <button class="btn copy" id="btn-copy">결과 복사</button>
</div>
<div class="toast" id="toast"></div>

<script>
// ============================================================================
// tts-check.html — v5.82.0 신규 TTS 실청취 검증 (standalone 부모용 도구)
// 앱(index.html)과 동일 origin → 같은 localStorage 설정 공유. 비밀값(serverUrl·pin) 하드코딩 없음.
// ============================================================================

// --- index.html getSettings()와 1:1 동일 (po_v4_settings + 구버전 폴백) ---
function getSettings() {
  var s = JSON.parse(localStorage.getItem('po_v4_settings') || 'null') || {
    serverUrl: '', pin: '', voiceKo: 'ko-KR-Chirp3-HD-Zephyr',
    voiceEn: 'en-US-Chirp3-HD-Zephyr', cardCount: 30, modeOverride: '', sheetsUrl: ''
  };
  if (!s.serverUrl) s.serverUrl = localStorage.getItem('po_worker_url') || '';
  if (!s.pin) s.pin = localStorage.getItem('po_app_pin') || '';
  if (!s.voiceKo) s.voiceKo = 'ko-KR-Chirp3-HD-Zephyr';
  return s;
}

// --- index.html cleanTextForTTS / textToSSML 1:1 동일 (body 필드 동일성 보장) ---
function cleanTextForTTS(text) {
  return text
    .replace(/[\u{1F600}-\u{1F64F}\u{1F300}-\u{1F5FF}\u{1F680}-\u{1F6FF}\u{1F1E0}-\u{1F1FF}\u{2600}-\u{27BF}\u{FE00}-\u{FEFF}\u{200D}\u{20E3}\u{E0020}-\u{E007F}]/gu, '')
    .replace(/\*{1,3}([^*]+)\*{1,3}/g, '$1')
    .replace(/^#{1,6}\s+/gm, '')
    .replace(/^[-*]\s+/gm, '')
    .replace(/[-–—]{2,}/g, ' ')
    .replace(/\s[-–—]\s/g, ' ')
    .replace(/\*+/g, '')
    .replace(/\s+/g, ' ')
    .trim();
}
function textToSSML(text) {
  var ssml = text
    .replace(/'([^']+)'/g, '<break time="100ms"/>$1<break time="80ms"/>')
    .replace(/,\s*/g, ',<break time="300ms"/>')
    .replace(/!\s*/g, '!<break time="400ms"/>')
    .replace(/\?\s*/g, '?<break time="400ms"/>')
    .replace(/\.\s*/g, '.<break time="350ms"/>')
    .replace(/(<break time="\d+ms"\/>)\s*(<break time="\d+ms"\/>)/g, '$1');
  return '<speak>' + ssml + '</speak>';
}

// --- 상태 ---
var STAGE_TITLE = { 3: 'stage 3 · 적용(4) 비단어 (25)', 4: 'stage 4 · 적용(4) 사자성어 (12)', 5: 'stage 5 · 적용(3) 의미낱말 (30)' };
var CHECK_KEY = 'po_tts_check_v582';
var APP_TTS = { currentAudio: null, stopRequested: false, rate: 0.9, items: [] };
var checkState = {};
try { checkState = JSON.parse(localStorage.getItem(CHECK_KEY) || '{}') || {}; } catch (e) { checkState = {}; }

function toast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(function() { t.classList.remove('show'); }, 1600);
}
function setStatus(msg) { document.getElementById('status').textContent = msg || ''; }

// --- TTS 1건 재생 (index.html textToSpeech ko 경로 재현) ---
function playOne(item) {
  var s = getSettings();
  // 중첩 재생 차단
  if (APP_TTS.currentAudio) { try { APP_TTS.currentAudio.pause(); } catch (e) {} APP_TTS.currentAudio = null; }
  var voiceName = s.voiceKo;
  var ssml = textToSSML(cleanTextForTTS(item.pronunciation));
  var headers = { 'Content-Type': 'application/json' };
  if (s.pin) headers['X-App-Pin'] = s.pin;
  var url = s.serverUrl.replace(/\/+$/, '') + '/api/tts';
  var body = JSON.stringify({
    input: { ssml: ssml },
    voice: { languageCode: 'ko-KR', name: voiceName },
    audioConfig: { audioEncoding: 'MP3', speakingRate: APP_TTS.rate }
  });
  return fetch(url, { method: 'POST', headers: headers, body: body })
    .then(function(res) { if (!res.ok) throw new Error('TTS ' + res.status); return res.json(); })
    .then(function(data) {
      return new Promise(function(resolve) {
        var audio = new Audio('data:audio/mp3;base64,' + data.audioContent);
        APP_TTS.currentAudio = audio;
        var done = function() { if (APP_TTS.currentAudio === audio) APP_TTS.currentAudio = null; resolve(); };
        audio.onended = done; audio.onerror = done;
        try {
          var p = audio.play();
          if (p && p.catch) p.catch(done);
        } catch (e) { done(); }
      });
    })
    .catch(function(e) { console.warn('TTS 실패:', e); toast('재생 실패: ' + (e.message || e)); });
}

function highlight(itemId) {
  var rows = document.querySelectorAll('.row');
  rows.forEach(function(r) { r.classList.toggle('playing', r.getAttribute('data-id') === itemId); });
}

// --- 순차 재생 ---
function playSequence(list, labelPrefix) {
  APP_TTS.stopRequested = false;
  var i = 0;
  function next() {
    if (APP_TTS.stopRequested || i >= list.length) {
      highlight(null);
      setStatus(APP_TTS.stopRequested ? '중지됨' : (labelPrefix + ' 완료'));
      return;
    }
    var item = list[i];
    highlight(item.id);
    setStatus(labelPrefix + ' ' + (i + 1) + '/' + list.length + ' · ' + item.orthography + ' [' + item.pronunciation + ']');
    playOne(item).then(function() {
      i++;
      if (APP_TTS.stopRequested) { highlight(null); setStatus('중지됨'); return; }
      setTimeout(next, 500);
    });
  }
  next();
}

function stopAll() {
  APP_TTS.stopRequested = true;
  if (APP_TTS.currentAudio) { try { APP_TTS.currentAudio.pause(); } catch (e) {} APP_TTS.currentAudio = null; }
  highlight(null);
  setStatus('중지됨');
}

// --- 체크 상태 ---
function updateCount() {
  var n = Object.keys(checkState).filter(function(k) { return checkState[k]; }).length;
  document.getElementById('count').innerHTML = '이상해요 체크: <b>' + n + '</b>개';
}
function toggleCheck(item, checked) {
  if (checked) checkState[item.id] = { orthography: item.orthography, pronunciation: item.pronunciation };
  else delete checkState[item.id];
  try { localStorage.setItem(CHECK_KEY, JSON.stringify(checkState)); } catch (e) {}
  updateCount();
}
function copyResults() {
  var keys = Object.keys(checkState).filter(function(k) { return checkState[k]; });
  if (keys.length === 0) { toast('체크된 낱말이 없어요'); return; }
  var lines = ['[TTS 이상 낱말 — v5.82.0]'];
  keys.forEach(function(k) { lines.push(checkState[k].orthography + ' [' + checkState[k].pronunciation + ']'); });
  var text = lines.join('\n');
  function fallback() {
    var ta = document.createElement('textarea');
    ta.value = text; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); toast('복사됨 (' + keys.length + '개)'); } catch (e) { toast('복사 실패 — 길게 눌러 직접 복사'); }
    document.body.removeChild(ta);
  }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(function() { toast('복사됨 (' + keys.length + '개)'); }, fallback);
  } else { fallback(); }
}

// --- 렌더 ---
function renderRows() {
  var main = document.getElementById('main');
  var byStage = { 3: [], 4: [], 5: [] };
  APP_TTS.items.forEach(function(it) { if (byStage[it.stage]) byStage[it.stage].push(it); });
  var html = '';
  [3, 4, 5].forEach(function(st) {
    var list = byStage[st];
    if (!list.length) return;
    html += '<div class="group"><h2>' + STAGE_TITLE[st] +
      ' <button class="btn" data-group="' + st + '" style="font-size:12px;padding:4px 10px;">▶ 그룹 듣기</button></h2>';
    list.forEach(function(it) {
      var checked = !!(checkState[it.id]);
      html += '<div class="row" data-id="' + esc(it.id) + '">' +
        '<button class="play" data-play="' + esc(it.id) + '">▶</button>' +
        '<span class="ortho">' + esc(it.orthography) + '</span>' +
        '<span class="pron">[' + esc(it.pronunciation) + ']</span>' +
        '<span class="grow"></span>' +
        '<label class="flag"><input type="checkbox" data-check="' + esc(it.id) + '"' + (checked ? ' checked' : '') + '> 이상해요</label>' +
        '</div>';
    });
    html += '</div>';
  });
  main.innerHTML = html;
  document.getElementById('bottombar').style.display = 'flex';
  updateCount();

  // 이벤트 바인딩 (인라인 onclick 미사용 — CSP/유지보수)
  main.querySelectorAll('[data-play]').forEach(function(btn) {
    btn.addEventListener('click', function() {
      var it = findItem(btn.getAttribute('data-play'));
      if (it) { APP_TTS.stopRequested = false; highlight(it.id); setStatus(it.orthography + ' [' + it.pronunciation + ']'); playOne(it).then(function() { highlight(null); }); }
    });
  });
  main.querySelectorAll('[data-check]').forEach(function(cb) {
    cb.addEventListener('change', function() { var it = findItem(cb.getAttribute('data-check')); if (it) toggleCheck(it, cb.checked); });
  });
  main.querySelectorAll('[data-group]').forEach(function(btn) {
    btn.addEventListener('click', function() {
      var st = Number(btn.getAttribute('data-group'));
      playSequence(byStage[st], STAGE_TITLE[st].split(' ·')[0]);
    });
  });
}
function findItem(id) { for (var i = 0; i < APP_TTS.items.length; i++) if (APP_TTS.items[i].id === id) return APP_TTS.items[i]; return null; }
function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }

// --- 초기화 ---
function showNotice(msg) { document.getElementById('main').innerHTML = '<div class="notice">' + msg + '</div>'; }

function init() {
  var s = getSettings();
  if (!s.serverUrl) {
    showNotice('앱 설정에서 서버 연결 후, 같은 기기에서 다시 열어 주세요.');
    return;
  }
  fetch('./speech-therapy.json?nocache=' + Date.now())
    .then(function(res) { if (!res.ok) throw new Error('데이터 로드 실패 ' + res.status); return res.json(); })
    .then(function(data) {
      var sets = (data && data.coverReadSets) || [];
      var items = (sets[0] && sets[0].items) || [];
      APP_TTS.items = items.filter(function(it) { return typeof it.stage === 'number' && it.stage >= 3; });
      if (!APP_TTS.items.length) { showNotice('stage 3 이상 신규 낱말이 없습니다.'); return; }
      renderRows();
      setStatus('총 ' + APP_TTS.items.length + '개 낱말 준비됨');
    })
    .catch(function(e) { showNotice('데이터를 불러오지 못했습니다: ' + esc(e.message || String(e))); });
}

document.getElementById('btn-play-all').addEventListener('click', function() { if (APP_TTS.items.length) playSequence(APP_TTS.items, '전체'); });
document.getElementById('btn-stop').addEventListener('click', stopAll);
document.getElementById('btn-rate').addEventListener('click', function() {
  var btn = this;
  if (APP_TTS.rate === 0.9) { APP_TTS.rate = 0.7; btn.classList.add('on'); btn.textContent = '🐢 천천히 0.7 (켜짐)'; }
  else { APP_TTS.rate = 0.9; btn.classList.remove('on'); btn.textContent = '🐢 천천히 0.7'; }
});
document.getElementById('btn-copy').addEventListener('click', copyResults);

init();
</script>
</body>
</html>
